<!doctype html>
<html lang="zh-CN" class="antialiased">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>prototype · 画布与控件 · bscp</title>
<!--
  ============================================================================
  PROTOTYPE —— 一次性代码，用来回答一个设计问题，不是产品代码。

  问题：三个画布控件的结构变体，通过 ?variant= 切换 ——
        A 角落裸图标 / B 底部细条 / C 全净 + 长按径向菜单。
  要回答：在大屏触控环境下，
        （a）控件可见尺寸能小到什么程度（命中区由 hit-expand 保底 48px），
        （b）常驻控件会不会挡住要给学生看的内容，
        （c）在「操作痕迹会被学生看到」这个约束下（ADR-0004），
             哪种控件的存在感可以被接受。

  注意：区域内容用灰条代替原始资料的裁切位图。本原型只评判控件、遮挡与手感，
        不评判字号是否可读。

  本文件由 src/ 构建产出，不要直接改。改 src/ 后运行：bun run build
  ============================================================================
-->
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<style>/*__CSS__*/</style>
</head>
<body class="font-sans">

<div id="app" class="isolate fixed inset-0 overflow-hidden
                       bg-neutral-100 text-neutral-900
                       dark:bg-neutral-950 dark:text-neutral-100">

  <!-- 画布视口 -->
  <div id="viewport" class="absolute inset-0 cursor-grab touch-none overflow-hidden">
    <div id="canvas" class="absolute top-0 left-0 origin-top-left
                            translate-x-(--vx) translate-y-(--vy) scale-(--vk)"></div>
  </div>

  <!-- 变体挂载点 -->
  <div id="chromeA" class="fixed bottom-2.5 left-2.5 z-40 hidden"></div>
  <div id="chromeB" class="fixed bottom-3.5 left-1/2 z-40 hidden -translate-x-1/2"></div>
  <div id="radial" class="pointer-events-none fixed left-(--rx) top-(--ry) z-50 hidden"></div>

  <!-- 径向回执（仅变体 C）：本原型不执行真实动作，只显示选中了什么 -->
  <div id="radialTip" class="fixed bottom-16 left-1/2 z-40 hidden -translate-x-1/2
       rounded-full bg-neutral-950 px-3 py-1.5 text-xs text-white shadow-lg"></div>

  <!-- 原型工具：不属于被评审的设计，上线前必须移除 -->
  <div id="switcher" class="fixed top-3.5 left-1/2 z-90 flex -translate-x-1/2
                            items-center gap-x-2.5 rounded-full bg-neutral-950
                            py-1.5 pr-2 pl-3.5 text-xs text-white shadow-lg"></div>
  <div class="fixed top-3.5 right-3 z-90 rounded-full bg-white px-2.5 py-1
              text-[0.625rem] font-semibold tracking-wide text-red-700
              ring-1 ring-red-200
              dark:bg-neutral-900 dark:text-red-400 dark:ring-red-900">PROTOTYPE</div>

</div>

<script>
/*__JS__*/
</script>
</body>
</html>
