<!doctype html>
<html lang="zh-CN" class="antialiased">
<head>
  <meta charset="utf-8">
  <!-- `maximum-scale=1, user-scalable=no` 不可省：画布已经把双指缩放接管成
       拖画布/缩放/平移（Canvas 的 `touch-none`），而浏览器的页面级捏合缩放
       会在同一次双指手势里跟它抢——两套缩放同时生效，画面往哪个方向缩全看
       谁先拿到手。一体机是 Windows Chrome/Edge，这两条 meta 在那上面都
       生效。工具条另配 touch-manipulation（见 ProductApp 的 #chrome）。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>prototype · 行为路径演示 · bscp</title>
  <!--
    ============================================================================
    PROTOTYPE —— 用来回答一个设计问题，不是产品代码。

    问题：spec 里那张「行为路径表」（入口 / 步数目标 / 误操作兜底）只有散文，
          不可评审。ADR-0004 的约束是物理属性——「控件得能被手指在大屏上准确
          点中」——而自己在脑子里渲染界面，渲染错了不会知道。

    要回答：
          （a）每条路径按表上的步数，真的走得通吗？
          （b）入口位置在「操作者只盯屏幕一个角落」的前提下好不好够到？
          （c）误操作兜底写的那句强确认，说清会丢什么了吗？

    做法：把 60 条 user story 压缩成 12 条行为路径，每条一个可点到底的线性
          演示。控件在这一层「真的活着」——点下去会有状态变化，但底层不接
          任何真实数据。每一屏都能用 URL 直接定位：
          ?path=<路径 key>&step=<从 0 起的步号>，例如 ?path=rerun&step=1
          就是「重跑解析」的第二步（强确认那一屏）。

    跑起来：bun install && bun run dev    然后开 http://localhost:5173
    ============================================================================
  -->
  <!--
    这里原来从 https://rsms.me/ 载 Inter。已经删掉，两条理由都跟「能不能跑」
    有关，不是审美问题：
      1. 目标环境是校内教室，没外网。这两条 <link> 在那儿是永远失败的请求，
         而冒烟/构建产物不该依赖一个到不了的网络。
      2. 它让 page.screenshot 卡在 "waiting for fonts to load"，30s 超时抛
         **未捕获异常**——而冒烟的 fails/notes 原本只在文件末尾输出，
         于是「字体超时」会把前面每一条断言的结果一起吞掉。
    去掉之后字体落到 index.css 里 --font-sans 声明的下一级
    （ui-sans-serif, system-ui, "Noto Sans SC", "Microsoft YaHei"）。
    那里仍然写着 "InterVariable"：留着它是为了这套字体名在自托管 Inter
    之后能自动生效（见工具条那些按渲染位置量的断言）。要自托管就往
    public/ 放 woff2 并在这里改成 @font-face，不要再走外链。
  -->
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
